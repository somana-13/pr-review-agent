[project]
name = "pr-review-agent"
version = "0.1.0"
description = "AI agent that reviews GitHub pull requests"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "boto3>=1.34",
    "langchain-aws>=0.1",
    "langgraph>=0.2",
    "semgrep>=1.70",
    "ruff>=0.6",
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.12",
    "datasets>=2.20",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pr-review = "pr_review_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_review_agent"]
