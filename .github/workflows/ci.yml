name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ finetune/ tests/

      - name: Run tests
        env:
          # dummy values: nothing in the unit-test suite actually calls out
          # to GitHub or Bedrock, but pydantic-settings validates Settings()
          # eagerly on import, so these two required fields must be present
          GITHUB_TOKEN: dummy-token-for-tests
          GUARDRAIL_ID: dummy-guardrail-id-for-tests
        run: pytest -v
